[project]
name = "unsa-audit"
version = "0.1.0"
description = "Backend de la plataforma capacitadora de auditores internos UNSA (POC)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.162.4",
    "pydantic-settings>=2.16.2",
    "pyjwt>=2.15.1",
    "sqlalchemy[asyncio]>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
unsa-audit = "unsa_audit.main:run"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "ac(id): criterio de aceptacion de la spec que verifica el test (ej. AC-001-3)",
    "integration: requiere servicios externos (Postgres)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pyright]
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
